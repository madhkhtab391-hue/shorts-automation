name: Create Arabic Kids Dino Short

on:
  workflow_dispatch:
    inputs:
      background_source:
        description: "Use the bundled dinosaur artwork or the Cloudflare/Pexels fallback"
        required: true
        default: artwork
        type: choice
        options:
          - artwork
          - pexels

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKGROUND_SOURCE: ${{ inputs.background_source }}
      PEXELS_FALLBACK_ENDPOINT: https://orange-cherry-5bc8.madhkhtab391.workers.dev/pexels

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install video and narration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg file fonts-noto-core fonts-noto-extra jq
          python3 -m pip install --user edge-tts
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare dinosaur artwork
        run: bash scripts/prepare_asset.sh

      - name: Fetch Pexels fallback background
        if: inputs.background_source == 'pexels'
        run: bash scripts/fetch_pexels_fallback.sh

      - name: Generate Arabic narration
        run: bash scripts/generate_narration.sh

      - name: Generate music and sound effects
        run: bash scripts/generate_audio.sh

      - name: Generate Arabic captions
        run: bash scripts/generate_captions.sh

      - name: Render vertical Short
        run: bash scripts/render_short.sh

      - name: Validate generated MP4
        run: bash scripts/validate_output.sh short.mp4

      - name: Upload Short artifact
        uses: actions/upload-artifact@v4
        with:
          name: arabic-kids-dino-short
          path: short.mp4
          if-no-files-found: error
