name: Create Short Test

on:
  workflow_dispatch:
    inputs: {}

jobs:
  create-short:
    runs-on: ubuntu-latest

    steps:
      - name: Get video from Cloudflare Worker
        run: |
          curl -L "https://orange-cherry-5bc8.madhkhtab391.workers.dev/pexels" -o videos.json

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ffmpeg fonts-noto-core fonts-noto-extra
          python3 -m pip install --upgrade edge-tts

      - name: Download video
        run: |
          VIDEO_URL=$(jq -r '.[0].videoUrl' videos.json)
          echo "Downloading video..."
          curl -L "$VIDEO_URL" -o original.mp4

      - name: Create Arabic voice
        run: |
          echo "الطبيعة تمنحنا لحظات جميلة تستحق أن نتوقف ونستمتع بها." > script.txt

          edge-tts \
            --voice ar-JO-TaimNeural \
            --rate=-5% \
            --volume=+0% \
            --text "$(cat script.txt)" \
            --write-media voice.mp3

      - name: Create subtitles
        run: |
          cat > captions.ass <<'EOF'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Noto Sans Arabic,70,&H00FFFFFF,&H00FFFFFF,&H00000000,&H80000000,1,0,2,60,60,180,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          Dialogue: 0,0:00:00.00,0:00:10.00,Default,,0,0,0,,الطبيعة تمنحنا لحظات جميلة تستحق أن نتوقف ونستمتع بها.
          EOF

      - name: Create Short
        run: |
          ffmpeg -y \
            -i original.mp4 \
            -i voice.mp3 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=captions.ass" \
            -map 0:v:0 \
            -map 1:a:0 \
            -t 10 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            -shortest \
            short.mp4

      - name: Check output
        run: |
          ls -lh short.mp4
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            short.mp4

      - name: Upload Short
        uses: actions/upload-artifact@v4
        with:
          name: generated-short
          path: short.mp4
